<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SAID KEYBOARD - أول كيبورد عربي لتعليم البرمجة</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="hero">
    <div class="logo">⌨️</div>
    <h1>SAID <span>KEYBOARD</span></h1>
    <p>أول كيبورد عربي لتعليم البرمجة</p>
    <div class="stars">4.9 ★★★★★ <b>10K تحميل</b></div>
    <div class="badges"><span>🔥 الأكثر تحميلاً</span><span>✅ بدون إعلانات</span></div>
  </header>

  <section class="features">
    <div class="feat"><b>🎓 تعلّم</b><span>دروس جواه</span></div>
    <div class="feat"><b>💻 كود جاهز</b><span>HTML CSS JS</span></div>
    <div class="feat"><b>🇪🇬 عربي كامل</b><span>تشكيل وأرقام</span></div>
  </section>

  <textarea id="editor" spellcheck="false" placeholder="اكتب الكود هنا..."></textarea>

  <div class="toolbar">
    <button id="runBtn">▶ تشغيل</button>
    <button id="clearBtn">🗑️ مسح</button>
    <button id="pasteBtn">📋 لصق</button>
    <button id="copyBtn">📄 نسخ</button>
  </div>

  <div id="preview"></div>

  <section class="keyboard">
    <div class="kb-tabs">
      <button class="kb-tab active" data-tab="learn">🎓 تعلّم</button>
      <button class="kb-tab" data-tab="arabic">🇪🇬 عربي</button>
      <button class="kb-tab" data-tab="html">HTML</button>
      <button class="kb-tab" data-tab="css">CSS</button>
      <button class="kb-tab" data-tab="js">JS</button>
    </div>
    <div id="kbArea"></div>
    <div class="kb-bottom">
      <button class="kb-btn space" data-key=" ">مسافة</button>
      <button class="kb-btn" data-key="&#10;">⏎ سطر جديد</button>
      <button class="kb-btn action" id="backBtn">⌫ مسح</button>
    </div>
  </section>

  <p class="footer">صُنع بحب في مصر 🇪🇬 - SAID KEYBOARD</p>
</div>
<script src="script.js"></script>
</body>
</html>
