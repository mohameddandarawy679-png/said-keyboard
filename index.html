<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>كيبورد Said - عربي + برمجة</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="topbar">
    <b>⌨️ Said Keyboard</b>
    <span id="modeLabel">عربي</span>
  </div>

  <textarea id="editor" placeholder="اكتب هنا... دوس على أي زرار في الكيبورد اللي تحت"></textarea>
  
  <div class="toolbar">
    <button id="copyBtn">📋 نسخ</button>
    <button id="pasteBtn">📥 لصق</button>
    <button id="clearBtn">🗑️ مسح</button>
    <button id="runBtn">▶ تشغيل الكود</button>
  </div>

  <div id="preview"></div>

  <!-- الكيبورد زي المتجر -->
  <div class="keyboard">
    <div class="kb-tabs">
      <button class="kb-tab active" data-kb="arabic">عربي 🇪🇬</button>
      <button class="kb-tab" data-kb="html">HTML</button>
      <button class="kb-tab" data-kb="css">CSS</button>
      <button class="kb-tab" data-kb="js">JS</button>
      <button class="kb-tab" data-kb="learn">🎓 تعلّم</button>
    </div>
    <div id="kbArea"></div>
    <div class="kb-bottom">
      <button class="kb-btn action" data-act="back">⌫</button>
      <button class="kb-btn space" data-act="space">مسافة</button>
      <button class="kb-btn action" data-act="enter">⏎</button>
    </div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
